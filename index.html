<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Convite para a Rayane ❤️</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❤️</text></svg>">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Playfair+Display:wght@600;800&display=swap" rel="stylesheet">
<style>
  body{font-family:'Nunito',system-ui,sans-serif;background:linear-gradient(160deg,#3d0a1a 0%,#6e1230 55%,#8e1b3e 100%);min-height:100vh;background-attachment:fixed}
  h1,h2{font-family:'Playfair Display',Georgia,serif}
  .card{position:relative;z-index:10;background:#fff;color:#4a0d1f;border-radius:1.5rem;box-shadow:0 25px 50px -12px #0007;padding:1.5rem}
  .card>*+*{margin-top:1.1rem}
  .card h1{font-size:1.75rem;font-weight:800;color:#9f1239;line-height:1.2}
  .card h2{font-size:1.1rem;font-weight:700;color:#9f1239}
  .ctr{text-align:center}
  .row{display:flex;gap:.75rem}.row>*{flex:1}
  .note{font-size:.75rem;background:#fdf2f8;border:1px solid #fbcfe8;border-radius:.75rem;padding:.5rem .75rem}
  .err{color:#be123c;font-weight:600;font-size:.875rem}
  .heart{position:fixed;pointer-events:none;z-index:0}
  .heart{bottom:-40px;opacity:.25;animation:float linear infinite}
  @keyframes float{to{transform:translateY(-115vh) rotate(25deg)}}
  .opt{width:100%;text-align:left;border:2px solid #fbcfe8;border-radius:1rem;padding:.75rem 1rem;background:#fff;color:#4a0d1f;font-weight:600;transition:.15s;display:block}
  .opt.sel,.opt:has(input:checked){background:#fdf2f8;border-color:#be185d;box-shadow:0 0 0 3px #fbcfe888}
  .opt.off{opacity:.4;cursor:not-allowed;text-decoration:line-through}
  .day{border:2px solid #fbcfe8;border-radius:.75rem;padding:.55rem 0;background:#fff;color:#4a0d1f;font-weight:700;transition:.15s}
  .day.sel{background:#be185d;color:#fff;border-color:#be185d}
  .day.off-date{opacity:.3;cursor:not-allowed;background:#f8fafc;border-color:#e2e8f0;text-decoration:line-through}
  .btn{border-radius:9999px;padding:.8rem 1.4rem;font-weight:700;transition:.15s}
  .btn:active{transform:scale(.97)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .pri{background:#be185d;color:#fff}
  .sec{background:#fce7f3;color:#831843}
  .fld{width:100%;border:2px solid #fbcfe8;border-radius:1rem;padding:.7rem 1rem;background:#fff;color:#4a0d1f}
  .fld:focus,.opt:focus-visible,.btn:focus-visible,.day:focus-visible{outline:3px solid #f472b6;outline-offset:2px}
  #toast{transition:.3s;transform:translate(-50%,-30px);opacity:0}
  #toast.show{transform:translate(-50%,0);opacity:1}
  #peek{animation:peek 4s ease-in-out infinite}
  @keyframes peek{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-6px) rotate(4deg)}}
  .conf{position:absolute;left:50%;top:60%;pointer-events:none;font-size:18px;line-height:1}
  @media (prefers-reduced-motion:reduce){.heart,#peek{animation:none}}
</style>
</head>
<body class="text-rose-50">
<div id="hearts" aria-hidden="true"></div>
<div id="toast" class="fixed top-4 left-1/2 z-50 bg-white text-rose-800 font-bold rounded-full shadow-2xl px-5 py-3 text-sm max-w-[90vw] text-center pointer-events-none"></div>

<div id="celebrate" class="hidden fixed inset-0 z-50 bg-black/70 flex items-center justify-center" onclick="this.classList.add('hidden')">
  <div class="text-center">
    <div class="font-black text-white leading-none" style="font-family:'Playfair Display',serif;font-size:11rem;text-shadow:0 8px 0 #e30613,0 0 40px #e30613">L</div>
    <div class="text-white text-4xl font-extrabold mt-2 tracking-wide">FAZ O L!</div>
    <div class="text-pink-200 mt-3 text-sm">13/13 ⭐️ toque para fechar</div>
  </div>
</div>

<main id="main" class="relative z-10 max-w-md mx-auto px-4 pt-20 pb-44">

<!-- ================= RAYANE ================= -->
<div id="rayane">
<div id="peek" aria-hidden="true" class="absolute right-8 select-none" style="top:-4.4rem;z-index:0;width:6.5rem;height:5.5rem">
<svg viewBox="0 0 100 85" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
<ellipse cx="22" cy="52" rx="9" ry="14" fill="#fff"/><ellipse cx="78" cy="52" rx="9" ry="14" fill="#fff"/>
<circle cx="50" cy="48" r="26" fill="#f0c7a2"/>
<path d="M24 52c0 22 12 33 26 33s26-11 26-33c-6 8-14 10-26 10S30 60 24 52z" fill="#fff"/>
<path d="M40 64q10 5 20 0q-10-6-20 0z" fill="#f0c7a2"/>
<path d="M33 52q17-12 34 0" fill="#fff" stroke="#fff" stroke-width="3"/>
<circle cx="40" cy="47" r="5" fill="#fff" stroke="#999" stroke-width=".8"/><circle cx="60" cy="47" r="5" fill="#fff" stroke="#999" stroke-width=".8"/>
<circle cx="38.5" cy="48.5" r="2.4" fill="#222"/><circle cx="58.5" cy="48.5" r="2.4" fill="#222"/>
<path d="M33 40q7-5 14-1M53 39q7-4 14 1" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
<ellipse cx="50" cy="32" rx="44" ry="8" fill="#ecdcab"/>
<path d="M28 32c0-20 8-28 22-28s22 8 22 28z" fill="#f4e8bd"/>
<path d="M28 30h44v5H28z" fill="#2a2a2a"/>
</svg></div>

<section id="p1" class="card">
  <h1>Oi Rayane! Você aceita um date com o Elder? 💘</h1>
  <div class="space-y-3">
    <h2>🙋‍♂️ Sobre mim</h2>
    <p class="text-sm leading-relaxed">Tenho ataxia (SCA1). Ela afeta um pouco a mobilidade física e posso precisar do seu ombro de vez em quando, mas garanto que ao vivo sou bem melhor do que qualquer pesquisa na internet!</p>
    <button class="opt" data-ata="ok">Por mim tudo bem ❤️</button>
    <button class="opt" data-ata="res">Tenho ressalvas 😅</button>
    <p class="note text-sm font-medium
